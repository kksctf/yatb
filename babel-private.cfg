# Babel mapping for PRIVATE-feature translation strings.
# Private strings are marked at the CALL SITE with p_()/np_() (not by file path), so this
# maps the SAME files as the public extraction; the split is done by keyword on the CLI:
#   pybabel extract -F babel-private.cfg --no-default-keywords -k p_ -k np_:1,2 -o private.pot .
# --no-default-keywords ensures only p_/np_ are collected (no _() and no {% trans %} blocks),
# keeping private strings out of the public messages.po. See Justfile `babel-extract-private`.
[python: **.py]
[jinja2: **/templates/**.jhtml]
extensions=jinja2.ext.i18n
