replication_factor = 1
consistency_mode = "consistent"

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# т.к. у нас одна нода без серьезной нагрузки, сознательно берем вместо lmdb - sqlite
# нет минусов с портабельностью и вообще sqlite - better than handmade db
db_engine = "sqlite"

# посмотрим. будет тормозить - уберем)0
# не будет тормозить - поднимем. Хотя бы нули будем сжимать так.
compression_level = 3

# openssl rand -hex 32
