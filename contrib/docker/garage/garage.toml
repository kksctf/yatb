rpc_secret = "6b428b20be3b06f01569c50e51545d59704b8004557c8f819fd441b06341cb94"

rpc_bind_addr = "[::1]:3901"
rpc_public_addr = "[::1]:3901"

bootstrap_peers = []
allow_world_readable_secrets = false # idk
allow_punycode = false

[s3_api]
s3_region = "garage" # yay fire in random places))0
api_bind_addr = "[::]:3900"
root_domain = "localhost"


